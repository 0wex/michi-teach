[package]
name = "lumi"
version = "0.1.0"
description = "Lumi virtual teacher assistant"
authors = ["Lumi"]
edition = "2021"

[lib]
name = "lumi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
# Estado global del teclado para el push-to-talk solo-modificadores
# (Ctrl+Option / Ctrl+Alt). El plugin de atajos no admite combos sin tecla.
device_query = "4"
# Detecta la app en primer plano (nombre + título) para enviarla al backend.
active-win-pos-rs = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSResponder", "NSGraphics"] }
# Dispara el diálogo de permiso de Accesibilidad para el push-to-talk.
macos-accessibility-client = "0.0.1"

[package]
name = "lumi"
version = "0.1.0"
description = "Lumi virtual teacher assistant"
authors = ["Lumi"]
edition = "2021"

[lib]
name = "lumi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
